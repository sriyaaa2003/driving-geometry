[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgeo"
version = "0.1.0"
description = "Embedding-based curation and a geometry-drift metric, evaluated on real BDD100K dashcam images"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "scikit-learn", "pandas", "pillow", "pyyaml", "matplotlib",
  "opencv-python-headless", "torch", "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["dgeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
